services:
  # Web Service (FastAPI)
  - type: web
    name: fastapi-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: POSTGRES_HOST
        fromDatabase:
          name: postgres-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: postgres-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: postgres-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: postgres-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: postgres-db
          property: database
      - key: APP_NAME
        value: FastAPIBackend

databases:
  # PostgreSQL Database
  - name: postgres-db
    databaseName: fastapi_db
    user: fastapi_user
    plan: free  # Start with free tier
