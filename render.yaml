services:
  # Web Service (FastAPI)
  - type: web
    name: fastapi-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Database credentials from Railway - Add these in Render dashboard
      - key: POSTGRES_HOST
        sync: false  # Will be set manually in Render dashboard
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: APP_NAME
        value: FastAPIBackend
